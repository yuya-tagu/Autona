name: 機能要望 / Feature request
description: 新機能・改善の提案 / Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        日本語・英語どちらでも書けます。 / Japanese or English is fine.
  - type: textarea
    id: problem
    attributes:
      label: 困っていること・やりたいこと / Problem or goal
      description: 大会運営・配信で何に困っているか、具体的な場面を教えてください。 / Describe the situation in tournament operation or streaming.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案 / Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: 実装への協力 / Willing to contribute?
      options:
        - 提案のみ / Suggestion only
        - PR を出せる / I can open a PR
