# Checks every pull request and every push to main: the Python suite, the
# web UI and the browser E2E against the headless app. Nothing here builds
# the exe or publishes anything (that is build_release.yml, run by hand).
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    python:
        name: Python tests
        # Same OS as the shipped app: the global-hotkey tests only run on
        # Windows (they skip elsewhere), and Qt/WebEngine behave as shipped.
        runs-on: windows-latest
        timeout-minutes: 30
        env:
            # tests/conftest.py also defaults this; set here so subprocesses
            # spawned outside pytest's environment get it too.
            QT_QPA_PLATFORM: offscreen
            # QtWebEngine on a headless runner: no Chromium sandbox and no GPU
            # (the runner's; the app keeps the sandbox: Design.md section 7.3).
            QTWEBENGINE_DISABLE_SANDBOX: "1"
            QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements-dev.txt

            - name: Install Python dependencies
              run: python -m pip install -r requirements-dev.txt

            # The per-file seconds of the previous full run, so the runner's
            # split is balanced. Each run saves a fresh entry (unique key) and
            # restores the newest earlier one. Best effort: with no cache the
            # runner splits by file size.
            - name: Restore pytest file times
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/autona_pytest_file_times.json
                  key: pytest-times-${{ github.run_id }}
                  restore-keys: pytest-times-

            # The same runner as local verification: the test files are split
            # over min(4, cpu_count) plain pytest processes. tests/live (real
            # start.gg API) is excluded by the runner itself. The serial run
            # that catches order dependence between files is python-serial
            # below (push to main only). tests/test_designer_runtime_contract.py
            # is included: node ships on windows-latest, its node-only tests are
            # pure (no web/node_modules, no network), and the jsdom ones skip
            # here (no web/node_modules); the web job runs them in full.
            - name: Run pytest (parallel)
              run: >-
                  python scripts/run_tests_parallel.py
                  --cache-path "${{ runner.temp }}/autona_pytest_file_times.json"

    # The net the parallel run cannot be: one serial pytest process over the
    # whole suite, which catches order dependence between test files and
    # anything a split hides. Only after a merge (push to main); not a required
    # check, so a failure here is a follow-up, not a blocked PR.
    python-serial:
        name: Python tests (serial)
        if: github.event_name == 'push'
        runs-on: windows-latest
        timeout-minutes: 30
        env:
            QT_QPA_PLATFORM: offscreen
            QTWEBENGINE_DISABLE_SANDBOX: "1"
            QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements-dev.txt

            - name: Install Python dependencies
              run: python -m pip install -r requirements-dev.txt

            # tests/live talks to the real start.gg API. It is already opt-in
            # (skipped unless AUTONA_LIVE_TESTS=1); ignoring it keeps CI
            # offline even if that variable is ever set on the runner.
            # test_designer_runtime_contract.py needs web/node_modules (jsdom)
            # and runs in the web job, where those are installed.
            - name: Run pytest (serial)
              run: >-
                  python -m pytest -q -ra -p no:cacheprovider
                  --ignore=tests/live
                  --ignore=tests/test_designer_runtime_contract.py

    # `ruff check` over the whole tree (the rules are in pyproject.toml; the
    # existing code is clean under them). Formatting (ruff format / prettier)
    # is NOT checked here: the existing code has not been reformatted yet, so
    # the format settings are only for people who run them by hand. The same
    # command runs locally (CONTRIBUTING.md, "Code style") and in pre-commit.
    lint:
        name: Lint (ruff)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            # ruff only (not requirements-dev.txt: no Qt wheels needed here).
            - name: Install ruff
              run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"

            - name: ruff check
              run: ruff check .

    web:
        name: Web UI build and tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install web dependencies
              working-directory: web
              run: npm ci

            # Actions sets CI=true on every step, and react-scripts then fails
            # the build on any ESLint warning. Build as the release does
            # (warnings printed, not fatal); the tests below run with CI=true.
            - name: Build web UI
              working-directory: web
              env:
                  CI: "false"
              run: npm run build

            - name: Run web tests
              working-directory: web
              env:
                  CI: "true"
              run: npm test -- --watchAll=false

            # The OBS runtime (layout/designer_runtime/runtime.js) and the
            # editor model (model.ts, pinned by model.test.js above) must
            # migrate project files identically. The Python side of that
            # contract runs runtime.js under node, with jsdom from
            # web/node_modules for its rendering checks.
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Run runtime/model contract tests
              run: |
                  python -m pip install pytest==9.0.3
                  python -m pytest -q -ra -p no:cacheprovider tests/test_designer_runtime_contract.py

    e2e:
        name: Browser E2E (headless app)
        # The Web UI and an OBS overlay in Chromium, against the real
        # `python main.py --headless` (web/e2e, ADR-005 S3d). Windows, like
        # the shipped app: the helper stops the app with Ctrl+Break, which
        # only Windows consoles have.
        runs-on: windows-latest
        timeout-minutes: 20
        env:
            QT_QPA_PLATFORM: offscreen
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements-dev.txt

            # pytest too: web/e2e/headless_server.py starts the app with the
            # headless smoke test's helpers (tests/), which import it.
            - name: Install Python dependencies
              run: python -m pip install -r requirements-dev.txt

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            - name: Install web dependencies
              working-directory: web
              run: npm ci

            # The headless app serves web/build. Built as the web job does
            # (ESLint warnings printed, not fatal).
            - name: Build web UI
              working-directory: web
              env:
                  CI: "false"
              run: npm run build

            - name: Install Chromium for Playwright
              working-directory: web
              run: npx playwright install chromium

            - name: Run browser E2E
              working-directory: web
              env:
                  CI: "true"
              run: npm run test:e2e

            # The HTML report, the traces of failed tests and the headless
            # app's console log (test-results/headless-console.txt).
            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      web/playwright-report/
                      web/test-results/
                  retention-days: 7
