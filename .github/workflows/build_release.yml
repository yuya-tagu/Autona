# Builds Autona and publishes a GitHub Release to the PUBLIC distribution repo
# (yuya-tagu/Autona-releases). The source repo is private, so the in-app
# updater reads releases from that separate public repo.
#
# Setup required before this works (one-time, by a human):
#   1. Create a PAT (fine-grained, repo = yuya-tagu/Autona-releases,
#      Contents: Read and write).
#   2. Add it to THIS repo's Actions secrets as RELEASE_REPO_TOKEN.
#
# NOTE: This full build+publish pipeline has not been validated in CI yet.
#       Trigger it manually (workflow_dispatch) and confirm the produced
#       release-windows.zip runs before relying on it. The reliable, supported
#       path today is the local script scripts/publish_release.ps1.
name: Build Release

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  # Same as CI and the local release build.
                  python-version: "3.12"

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install Python dependencies
              run: pip install -r .\dependencies\requirements.txt pyinstaller

            # CI=false: Actions sets CI=true, which makes react-scripts fail
            # the build on ESLint warnings. The local release build (runbook
            # step 3) does not, and neither should this.
            - name: Build Web UI
              env:
                  CI: "false"
              run: |
                  cd web
                  npm ci
                  npm run build

            # onedir build: dist/Autona/ holds the small Autona.exe launcher
            # and _internal/ (Python runtime + Qt/WebEngine). gen_release.ps1
            # packages both from the project root, and the launcher does not
            # start without _internal/ (see .claude/rules/build-and-release.md).
            - name: Build Autona.exe
              shell: pwsh
              run: |
                  pyinstaller --noconfirm .\dependencies\autona.spec
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  Remove-Item -Recurse -Force .\_internal -ErrorAction SilentlyContinue
                  Copy-Item -Recurse .\dist\Autona\_internal .\_internal
                  Copy-Item -Force .\dist\Autona\Autona.exe .\Autona.exe

            # gen_release.ps1 resolves the project root from its own location
            # and validates the zip it writes (validate_release_zip.ps1).
            - name: Package release zip
              shell: pwsh
              run: .\scripts\gen_release.ps1

            # publish_release.ps1 re-validates the zip right before publishing
            # (release runbook step 8) and tags it v<assets/versions.json
            # program>, the version the in-app updater compares against.
            - name: Publish Release to public repo
              shell: pwsh
              env:
                  # PAT with Contents:write on yuya-tagu/Autona-releases.
                  GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
              run: .\scripts\publish_release.ps1
