<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24px" height="24px" fill="none">
  <!-- Monitor / OBS display showing a scoreboard bar -->
  <rect x="2.5" y="4" width="19" height="13" rx="2" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- stand -->
  <line x1="9" y1="20" x2="15" y2="20" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="12" y1="17" x2="12" y2="20" stroke="#ffffff" stroke-width="1.6"/>
  <!-- scoreboard bar with a centre split -->
  <rect x="5.5" y="9" width="13" height="3.2" rx="0.8" fill="#ffffff"/>
  <line x1="12" y1="9" x2="12" y2="12.2" stroke="#252524" stroke-width="1.2"/>
</svg>
