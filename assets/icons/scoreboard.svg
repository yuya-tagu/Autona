<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24px" height="24px" fill="none">
  <!-- Bold, angular "VS": a two-stroke V on the left and a
       sharp-cornered (Z-shape) S on the right. No separator glyph. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.6"
     stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="10">
    <!-- V -->
    <polyline points="2.5,4.5 7,19.5 11.5,4.5"/>
    <!-- S (angular, Z-shaped) -->
    <polyline points="21.5,4.5 14,4.5 14,12 21.5,12 21.5,19.5 14,19.5"/>
  </g>
</svg>
