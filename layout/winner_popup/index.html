<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Winner popup: bottom center. Hidden until a player reaches first_to. -->
    <div class="winner_popup">
      <svg class="crown" viewBox="0 0 64 40" aria-hidden="true">
        <defs>
          <!-- Fixed gold (not the accent color): bright top, deep amber base. -->
          <linearGradient id="crown_gold" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0" stop-color="#fff3b0" />
            <stop offset="0.3" stop-color="#f6c945" />
            <stop offset="0.55" stop-color="#fff0a0" />
            <stop offset="0.8" stop-color="#d79a1c" />
            <stop offset="1" stop-color="#a86f0c" />
          </linearGradient>
        </defs>
        <path d="M4 34 L8 8 L22 22 L32 4 L42 22 L56 8 L60 34 Z" fill="url(#crown_gold)" />
        <rect x="6" y="35" width="52" height="5" rx="1.5" fill="url(#crown_gold)" />
      </svg>
      <div class="logo"></div>
      <div class="text_block">
        <div class="winner_label">WINNER</div>
        <div class="winner_name"></div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
