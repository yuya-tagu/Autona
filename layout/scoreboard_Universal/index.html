<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="ssbu">
    <!-- Tournament logo -->
    <div class="logo tile fade"></div>

    <!-- Phase | Round -->
    <div class="round_info fade_right">
      <span class="tournament_name"></span>
      <span class="phase_label"></span>
      <span class="round_separator"></span>
      <span class="match_label"></span>
    </div>

    <!-- P1 -->
    <div class="p1 under_chips"></div>
    <div class="p1 chips">
      <div class="flagcountry chip fade_stagger_reverse"></div>
      <div class="seed chip fade_stagger_reverse"></div>
      <div class="twitter chip fade_stagger_reverse"></div>
      <!-- <div class="pronoun chip fade_stagger_reverse"></div> -->
      <div class="flagstate chip fade_stagger_reverse"></div>
    </div>
    <div class="p1 player_flag_container tile fade_right"></div>

    <div class="p1 container tile fade_right">
      <div class="name"></div>
      <div class="sponsor_icon"></div>
    </div>
    <div class="p1 score_container tile fade_right">
      <div class="score"></div>
    </div>


    <!-- P2 -->
    <div class="p2 under_chips"></div>
    <div class="p2 chips">
      <div class="flagcountry chip fade_stagger_reverse"></div>
      <div class="seed chip fade_stagger_reverse"></div>
      <div class="twitter chip fade_stagger_reverse"></div>
      <!-- <div class="pronoun chip fade_stagger_reverse"></div> -->
      <div class="flagstate chip fade_stagger_reverse"></div>
    </div>
    <div class="p2 player_flag_container tile fade_left"></div>

    <div class="p2 container tile fade_left">
      <div class="name"></div>
      <div class="sponsor_icon"></div>
    </div>
    <div class="p2 score_container tile fade_left">
      <div class="score"></div>
    </div>


    <!-- Game Boxes -->
    <div class="dark score_boxes"></div>
    <div class="blue score_boxes"></div>
    <div class="red score_boxes"></div>
    <div class="word score_boxes"></div>

    <script src="common.js"></script>
    <script src="index.js"></script>
  </body>
</html>
