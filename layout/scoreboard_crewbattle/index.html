<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="ssbu">
    <div id="crew-container">
      <!-- Tournament name + phase | round (from EVENT tab + SCORE tab) -->
      <div id="round-info" class="glass">
        <span id="tournament-name"></span>
        <span id="phase-round"></span>
      </div>

      <!-- Header: team names + auto-summed remaining-stock totals -->
      <div id="crew-header" class="glass">
        <div id="tname1" class="team-name team-name-left"><span class="fit"></span></div>
        <div id="totals">
          <span id="total1" class="total total-left">0</span>
          <span class="total-sep">-</span>
          <span id="total2" class="total total-right">0</span>
        </div>
        <div id="tname2" class="team-name team-name-right"><span class="fit"></span></div>
      </div>

      <!-- Member strips (rows built dynamically from memberNum) -->
      <div id="team1" class="crew-col crew-col-left"></div>
      <div id="team2" class="crew-col crew-col-right"></div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
