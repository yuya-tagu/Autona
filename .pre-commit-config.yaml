# Install once:  pip install -r requirements-dev.txt ; pre-commit install
# Runs `ruff check` (detect only, no auto-fix) on the files you commit; CI runs
# the same check over the whole tree. Formatting (ruff format, prettier) is not
# a hook yet: the existing code has not been reformatted, so it is optional and
# run by hand (see CONTRIBUTING.md, "Code style").
#
# A local hook on purpose: the version comes from requirements-dev.txt, so the
# editor, pre-commit and CI agree.
repos:
    - repo: local
      hooks:
          - id: ruff-check
            name: ruff check
            entry: python -m ruff check --force-exclude
            language: system
            types: [python]
